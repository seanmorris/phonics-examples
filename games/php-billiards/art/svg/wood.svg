<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".015625 .125" numOctaves="3" seed="27" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" result="tinted" values=".56 0 0 0 .18  0 .24 0 0 .06  0 0 .08 0 .015  0 0 0 .72 0"/>
      <feBlend in="SourceGraphic" in2="tinted" mode="multiply"/>
    </filter>
    <pattern id="pores" width="64" height="32" patternUnits="userSpaceOnUse">
      <!-- Each pore curve spans exactly one 64 px period with matching end tangents and is drawn at -64, 0, and 64, so
           strokes crossing the pattern edge are whole and the tile wraps without a step. -->
      <path d="M-64 9 C-48 3 -16 15 0 9 C16 3 48 15 64 9 C80 3 112 15 128 9 M-64 24 C-46 17 -18 31 0 24 C18 17 46 31 64 24 C82 17 110 31 128 24" fill="none" stroke="#e3a35c" stroke-opacity=".16" stroke-width="1"/>
      <path d="M8 14 C22 8 33 20 51 11" fill="none" stroke="#281006" stroke-opacity=".35" stroke-width=".8"/>
    </pattern>
  </defs>
  <rect width="256" height="256" fill="#8c5129" filter="url(#grain)"/>
  <rect width="256" height="256" fill="url(#pores)"/>
  <!-- Knots are drawn per instance in billiards.frag, so their size, placement, and darkness vary instead of repeating with this tile. -->
</svg>
