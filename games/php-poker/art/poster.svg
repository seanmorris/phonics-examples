<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Catalog poster: the classic field with the seats' plates and fans sketched in, no live state. -->
  <defs>
    <radialGradient id="felt" cx="50%" cy="48%" r="62%">
      <stop offset="0" stop-color="#25884f"/>
      <stop offset=".55" stop-color="#1f8f45"/>
      <stop offset="1" stop-color="#1a5f3a"/>
    </radialGradient>
    <pattern id="back" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#b9242d"/>
      <path d="M0 6h12M6 0v12" stroke="#f4f1e8" stroke-width="1.2" opacity=".7"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#felt)"/>
  <rect width="1280" height="28" fill="#121212"/>
  <text x="14" y="20" font-family="Barlow Semi Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="15" fill="#f4f1e8" letter-spacing=".5">GAME   POKER   DRAW POKER</text>
  <text x="1266" y="20" text-anchor="end" font-family="Barlow Semi Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="15" fill="#f4f1e8">DRAW POKER</text>
  <g id="seat">
    <rect x="-92" y="-58" width="184" height="24" fill="#f4f1e8" stroke="#121212" stroke-width="2"/>
    <g transform="translate(-81,-26)">
      <rect x="0" y="0" width="58" height="81" rx="4" fill="url(#back)" stroke="#121212"/>
      <rect x="26" y="0" width="58" height="81" rx="4" fill="url(#back)" stroke="#121212"/>
      <rect x="52" y="0" width="58" height="81" rx="4" fill="url(#back)" stroke="#121212"/>
      <rect x="78" y="0" width="58" height="81" rx="4" fill="url(#back)" stroke="#121212"/>
      <rect x="104" y="0" width="58" height="81" rx="4" fill="url(#back)" stroke="#121212"/>
    </g>
    <g transform="translate(-92,60)">
      <ellipse cx="0" cy="0" rx="15" ry="6.3" fill="#cfcfcf" stroke="#121212"/>
      <ellipse cx="0" cy="-4" rx="15" ry="6.3" fill="#cfcfcf" stroke="#121212"/>
      <ellipse cx="26" cy="-14" rx="15" ry="6.3" fill="#d8403d" stroke="#121212"/>
      <ellipse cx="26" cy="-18" rx="15" ry="6.3" fill="#d8403d" stroke="#121212"/>
      <ellipse cx="52" cy="0" rx="15" ry="6.3" fill="#3a5fd8" stroke="#121212"/>
    </g>
  </g>
  <use href="#seat" x="640" y="128"/>
  <use href="#seat" x="308" y="201"/>
  <use href="#seat" x="972" y="201"/>
  <use href="#seat" x="170" y="378"/>
  <use href="#seat" x="1110" y="378"/>
  <use href="#seat" x="308" y="555"/>
  <use href="#seat" x="972" y="555"/>
  <rect x="540" y="268" width="200" height="24" fill="#f4f1e8" stroke="#121212" stroke-width="2"/>
  <text x="640" y="285" text-anchor="middle" font-family="Barlow Semi Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="14" fill="#121212">TOTAL POT (0)</text>
  <rect x="603" y="306" width="74" height="104" rx="5" fill="url(#back)" stroke="#121212"/>
  <text x="640" y="470" text-anchor="middle" font-family="Barlow Semi Condensed, Arial Narrow, sans-serif" font-weight="700" font-size="54" fill="#f4f1e8" letter-spacing="2">DRAW POKER</text>
  <text x="640" y="500" text-anchor="middle" font-family="Barlow Semi Condensed, Arial Narrow, sans-serif" font-weight="600" font-size="18" fill="#f4f1e8" opacity=".85">Five-card draw · jacks or better · 2 to 8 seats</text>
